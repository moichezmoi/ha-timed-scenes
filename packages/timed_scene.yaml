# =====================================================================
#  TIMED SCENE — backend
#  Temporarily applies states to an ordered list of entities during a
#  time window [start, end[, then restores them.
#
#  Contents:
#   1. template  : the registry sensor.timed_scenes
#   2. script    : timed_scene_set / _delete    (called by the card)
#                  timed_scene_start / _stop / _release / _apply (internes)
#   3. automation: the engine
#
#  Type table (supported domains): see script.timed_scene_apply
#  and the "supported_domains" variable of script.timed_scene_set.
# =====================================================================


# ---------------------------------------------------------------------
# 1. THE REGISTRY
#    Trigger-based template sensor: it is only recomputed when it receives
#    one of the 3 events below. Its "scenes" attribute is a dictionary
#    { scene_id: {...} }. It is restored after a Home Assistant restart.
# ---------------------------------------------------------------------
template:
  - triggers:
      - trigger: event
        event_type: timed_scene_set        # create / replace a scene
        id: set
      - trigger: event
        event_type: timed_scene_runtime    # update status / previous
        id: runtime
      - trigger: event
        event_type: timed_scene_delete     # remove a scene
        id: delete
    actions:
      # The new dictionary is computed once here, then reused by both
      # the sensor state and its attribute.
      - variables:
          current: "{{ state_attr('sensor.timed_scenes', 'scenes') or {} }}"
          d: "{{ trigger.event.data }}"
          new_scenes: >-
            {%- set ns = namespace(out={}) -%}
            {#- Copy every scene except the one targeted by the event -#}
            {%- for k, v in current.items() if k != d.id -%}
              {%- set ns.out = dict(ns.out, **{k: v}) -%}
            {%- endfor -%}
            {%- set old = current.get(d.id) -%}
            {%- if trigger.id == 'set' -%}
              {#- If the scene is already running, keep its runtime state -#}
              {%- set running = old is not none and old.status == 'ongoing' -%}
              {%- set entry = {
                    'start': d.start,
                    'end': d.end,
                    'entities': d.entities,
                    'status': 'ongoing' if running else 'planned',
                    'previous': old.previous if running else {},
                    'started_at': old.started_at if running else none,
                    'reapply': running,
                    'updated': d.token } -%}
              {%- set ns.out = dict(ns.out, **{d.id: entry}) -%}
            {%- elif trigger.id == 'runtime' and old is not none -%}
              {%- set entry = dict(old,
                    status=d.status,
                    previous=d.previous,
                    started_at=d.started_at,
                    reapply=false,
                    updated=d.token) -%}
              {%- set ns.out = dict(ns.out, **{d.id: entry}) -%}
            {%- endif -%}
            {#- 'delete' trigger: the scene is simply not copied -#}
            {{ ns.out }}
    sensor:
      - name: Timed scenes
        unique_id: timed_scenes_registry
        icon: mdi:calendar-clock
        state: "{{ new_scenes | count }}"
        attributes:
          scenes: "{{ new_scenes }}"


# ---------------------------------------------------------------------
# 2. SCRIPTS
# ---------------------------------------------------------------------
script:

  # ===== Called by the card: create or update a scene ===============
  timed_scene_set:
    alias: Timed scene – set
    description: Validates, then creates or replaces a timed scene. Returns {ok, errors} as response.
    mode: queued
    fields:
      id:
        description: Scene identifier (lowercase letters, digits, _)
        example: living_room_heater
        required: true
        selector:
          text:
      start:
        description: Start date and time
        required: true
        selector:
          datetime:
      end:
        description: End date and time (ignored when a duration is given)
        selector:
          datetime:
      duration:
        description: Duration (takes precedence over end)
        selector:
          duration:
      entities:
        description: >
          Ordered list of {entity, start_value, end_mode (value|previous|none), end_value}
        required: true
        selector:
          object:
    sequence:
      - variables:
          # --- Type table: supported domains ---
          supported_domains: [switch, input_boolean, select, input_select]
          ts_now: "{{ now().timestamp() }}"
          ts_start: "{{ as_timestamp(start, 0) }}"
          # Duration accepted as {hours: 3}, "03:00:00" or a number of seconds
          duration_s: >-
            {%- if duration is mapping -%}
              {{ (duration.get('days', 0) | float(0)) * 86400 + (duration.get('hours', 0) | float(0)) * 3600
                 + (duration.get('minutes', 0) | float(0)) * 60 + (duration.get('seconds', 0) | float(0)) }}
            {%- elif duration is number -%}{{ duration }}
            {%- elif duration is defined and duration not in [none, ''] -%}
              {{ as_timedelta(duration | string).total_seconds() if as_timedelta(duration | string) else 0 }}
            {%- else -%}0{%- endif -%}
          ts_end: >-
            {{ ts_start + duration_s if duration_s > 0 else as_timestamp(end if end is defined else none, 0) }}
          # Normalize entities: values as text, default end_mode
          items: >-
            {%- set ns = namespace(out=[]) -%}
            {%- for it in (entities if entities is iterable and entities is not string and entities is not mapping else []) -%}
              {%- set sv = it.get('start_value') -%}
              {%- set ev = it.get('end_value') -%}
              {%- set ns.out = ns.out + [{
                    'entity': it.get('entity', '') | string,
                    'start_value': (('on' if sv else 'off') if sv is boolean else sv | string) if sv is not none else '',
                    'end_mode': it.get('end_mode', 'previous') | string,
                    'end_value': (('on' if ev else 'off') if ev is boolean else ev | string) if ev is not none else '' }] -%}
            {%- endfor -%}
            {{ ns.out }}
          errors: >-
            {%- set e = namespace(l=[]) -%}
            {%- if not (id is defined and id | string | regex_match('^[a-z0-9_]+$')) -%}
              {%- set e.l = e.l + ["invalid id (lowercase letters, digits and _ only)"] -%}{%- endif -%}
            {%- if ts_start == 0 -%}{%- set e.l = e.l + ["invalid start"] -%}{%- endif -%}
            {%- if ts_end == 0 -%}{%- set e.l = e.l + ["missing end or duration"] -%}
            {%- elif ts_end <= ts_start -%}{%- set e.l = e.l + ["end must be after start"] -%}
            {%- elif ts_end <= ts_now -%}{%- set e.l = e.l + ["end is already in the past"] -%}{%- endif -%}
            {%- if items | count == 0 -%}{%- set e.l = e.l + ["no entity"] -%}{%- endif -%}
            {%- for it in items -%}
              {%- if not (it.entity | regex_match('^[a-z0-9_]+\.[a-z0-9_]+$')) or states[it.entity] is none -%}
                {%- set e.l = e.l + ["unknown entity: " ~ it.entity] -%}
              {%- elif it.entity.split('.')[0] not in supported_domains -%}
                {%- set e.l = e.l + ["unsupported entity type: " ~ it.entity] -%}
              {%- endif -%}
              {%- if it.start_value == '' -%}{%- set e.l = e.l + ["missing start_value: " ~ it.entity] -%}{%- endif -%}
              {%- if it.end_mode not in ['value', 'previous', 'none'] -%}
                {%- set e.l = e.l + ["invalid end_mode: " ~ it.entity] -%}
              {%- elif it.end_mode == 'value' and it.end_value == '' -%}
                {%- set e.l = e.l + ["missing end_value: " ~ it.entity] -%}{%- endif -%}
            {%- endfor -%}
            {{ e.l }}
      # --- Invalid data: stop and return the errors ---
      - if:
          - condition: template
            value_template: "{{ errors | count > 0 }}"
        then:
          - variables:
              result: "{{ {'ok': false, 'errors': errors} }}"
          - stop: Timed scene rejected
            response_variable: result
      # --- Running scene losing some entities: release them ---
      - variables:
          old: "{{ (state_attr('sensor.timed_scenes', 'scenes') or {}).get(id) }}"
          new_entities: "{{ items | map(attribute='entity') | list }}"
          removed: >-
            {{ (old.entities | rejectattr('entity', 'in', new_entities) | list)
               if old is not none and old.status == 'ongoing' else [] }}
      - if:
          - condition: template
            value_template: "{{ removed | count > 0 }}"
        then:
          - action: script.timed_scene_release
            data:
              id: "{{ id }}"
              items: "{{ removed }}"
              previous: "{{ old.previous }}"
      # --- Store the scene in the registry ---
      - variables:
          token: "{{ now().timestamp() }}"
      - event: timed_scene_set
        event_data:
          id: "{{ id }}"
          start: "{{ ts_start | timestamp_local }}"
          end: "{{ ts_end | timestamp_local }}"
          entities: "{{ items }}"
          token: "{{ token }}"
      # Wait until the registry has processed the event
      - wait_template: >-
          {{ (state_attr('sensor.timed_scenes', 'scenes') or {}).get(id, {}).get('updated') == token }}
        timeout: "00:00:05"
        continue_on_timeout: true
      # Wake the engine up so a scene can start immediately
      - event: timed_scene_check
      - variables:
          result: "{{ {'ok': true, 'id': id, 'start': ts_start | timestamp_local, 'end': ts_end | timestamp_local} }}"
      - stop: Timed scene saved
        response_variable: result


  # ===== Called by the card: delete a scene ==========================
  timed_scene_delete:
    alias: Timed scene – delete
    description: Deletes a timed scene (restores the entities if it is running).
    mode: queued
    fields:
      id:
        required: true
        selector:
          text:
    sequence:
      - variables:
          scene: "{{ (state_attr('sensor.timed_scenes', 'scenes') or {}).get(id) }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ scene is not none and scene.status == 'ongoing' }}"
            sequence:
              # stop restores the entities, then removes the scene
              - action: script.timed_scene_stop
                data:
                  id: "{{ id }}"
                  remove: true
          - conditions:
              - condition: template
                value_template: "{{ scene is not none }}"
            sequence:
              - event: timed_scene_delete
                event_data:
                  id: "{{ id }}"
              - wait_template: "{{ id not in (state_attr('sensor.timed_scenes', 'scenes') or {}) }}"
                timeout: "00:00:05"
                continue_on_timeout: true
      - variables:
          result: "{{ {'ok': scene is not none, 'id': id} }}"
      - stop: Timed scene deleted
        response_variable: result


  # ===== Internal: start (or re-apply) a scene =======================
  timed_scene_start:
    alias: Timed scene – start (internal)
    mode: queued
    fields:
      id:
        required: true
        selector:
          text:
    sequence:
      - variables:
          scenes: "{{ state_attr('sensor.timed_scenes', 'scenes') or {} }}"
          scene: "{{ scenes.get(id) }}"
      - condition: template
        value_template: "{{ scene is not none }}"
      - variables:
          # Original value of each entity, by priority:
          #  1. already stored by this scene (re-apply)
          #  2. stored by ANOTHER running scene holding the same entity
          #     (otherwise we would store the value forced by that scene)
          #  3. the current state of the entity
          new_previous: >-
            {%- set own = scene.previous or {} -%}
            {%- set ns = namespace(p={}) -%}
            {%- for it in scene.entities -%}
              {%- set e = it.entity -%}
              {%- set f = namespace(v=none) -%}
              {%- if e in own -%}
                {%- set f.v = own[e] -%}
              {%- else -%}
                {%- for sid, s in scenes.items() if sid != id and s.status == 'ongoing' -%}
                  {%- if f.v is none and e in (s.previous or {}) -%}{%- set f.v = s.previous[e] -%}{%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {%- set ns.p = dict(ns.p, **{e: (f.v if f.v is not none else states(e))}) -%}
            {%- endfor -%}
            {{ ns.p }}
          token: "{{ now().timestamp() }}"
      # 1. First store the original values in the registry…
      - event: timed_scene_runtime
        event_data:
          id: "{{ id }}"
          status: ongoing
          previous: "{{ new_previous }}"
          started_at: "{{ scene.started_at if scene.started_at is not none else token }}"
          token: "{{ token }}"
      - wait_template: >-
          {{ (state_attr('sensor.timed_scenes', 'scenes') or {}).get(id, {}).get('updated') == token }}
        timeout: "00:00:05"
        continue_on_timeout: true
      # 2. …then apply the values, in list order
      - repeat:
          for_each: "{{ scene.entities }}"
          sequence:
            - action: script.timed_scene_apply
              data:
                entity: "{{ repeat.item.entity }}"
                value: "{{ repeat.item.start_value }}"


  # ===== Internal: stop a scene =======================================
  timed_scene_stop:
    alias: Timed scene – stop (internal)
    mode: queued
    fields:
      id:
        required: true
        selector:
          text:
      remove:
        description: true = remove the scene; false = set it back to "planned"
        selector:
          boolean:
    sequence:
      - variables:
          scene: "{{ (state_attr('sensor.timed_scenes', 'scenes') or {}).get(id) }}"
      - condition: template
        value_template: "{{ scene is not none and scene.status == 'ongoing' }}"
      # 1. Restore the entities, in list order
      - action: script.timed_scene_release
        data:
          id: "{{ id }}"
          items: "{{ scene.entities }}"
          previous: "{{ scene.previous }}"
      # 2. Update the registry
      - variables:
          token: "{{ now().timestamp() }}"
      - if:
          - condition: template
            value_template: "{{ remove | default(true) }}"
        then:
          - event: timed_scene_delete
            event_data:
              id: "{{ id }}"
          - wait_template: "{{ id not in (state_attr('sensor.timed_scenes', 'scenes') or {}) }}"
            timeout: "00:00:05"
            continue_on_timeout: true
        else:
          - event: timed_scene_runtime
            event_data:
              id: "{{ id }}"
              status: planned
              previous: {}
              started_at: null
              token: "{{ token }}"
          - wait_template: >-
              {{ (state_attr('sensor.timed_scenes', 'scenes') or {}).get(id, {}).get('updated') == token }}
            timeout: "00:00:05"
            continue_on_timeout: true


  # ===== Internal: release a list of entities of a scene ==============
  # For each entity (in order):
  #  - if ANOTHER running scene holds it: apply the start value of the most
  #    recently started one (stack behaviour);
  #  - otherwise: end_mode value → end_value / previous → original value / none → nothing.
  timed_scene_release:
    alias: Timed scene – release (internal)
    mode: parallel
    fields:
      id:
        required: true
        selector:
          text:
      items:
        required: true
        selector:
          object:
      previous:
        selector:
          object:
    sequence:
      - variables:
          scenes: "{{ state_attr('sensor.timed_scenes', 'scenes') or {} }}"
      - repeat:
          for_each: "{{ items }}"
          sequence:
            - variables:
                e: "{{ repeat.item.entity }}"
                holder: >-
                  {%- set h = namespace(found=false, value='', t=0) -%}
                  {%- for sid, s in scenes.items() if sid != id and s.status == 'ongoing' -%}
                    {%- for it in s.entities if it.entity == e -%}
                      {%- if not h.found or (s.started_at | float(0)) > h.t -%}
                        {%- set h.found = true -%}
                        {%- set h.value = it.start_value -%}
                        {%- set h.t = s.started_at | float(0) -%}
                      {%- endif -%}
                    {%- endfor -%}
                  {%- endfor -%}
                  {{ {'found': h.found, 'value': h.value} }}
            - choose:
                - alias: Another running scene holds the entity
                  conditions:
                    - condition: template
                      value_template: "{{ holder.found }}"
                  sequence:
                    - action: script.timed_scene_apply
                      data:
                        entity: "{{ e }}"
                        value: "{{ holder.value }}"
                - alias: End with a given value
                  conditions:
                    - condition: template
                      value_template: "{{ repeat.item.end_mode == 'value' }}"
                  sequence:
                    - action: script.timed_scene_apply
                      data:
                        entity: "{{ e }}"
                        value: "{{ repeat.item.end_value }}"
                - alias: End with the original value
                  conditions:
                    - condition: template
                      value_template: "{{ repeat.item.end_mode == 'previous' and e in (previous or {}) }}"
                  sequence:
                    - action: script.timed_scene_apply
                      data:
                        entity: "{{ e }}"
                        value: "{{ previous[e] }}"
              # end_mode 'none': no branch matches → entity left untouched


  # ===== Internal: THE TYPE TABLE =====================================
  # Applies a value to an entity according to its domain.
  # To support a new type: add a branch here AND the domain to
  # "supported_domains" (script.timed_scene_set).
  timed_scene_apply:
    alias: Timed scene – apply value (internal)
    mode: parallel
    fields:
      entity:
        required: true
        selector:
          entity:
      value:
        required: true
        selector:
          text:
    sequence:
      - variables:
          domain: "{{ entity.split('.')[0] }}"
          v: "{{ value | string }}"
      # Nothing to do if the entity already has the value
      - condition: template
        value_template: "{{ states(entity) != v }}"
      - choose:
          - alias: Switches (on/off)
            conditions:
              - condition: template
                value_template: "{{ domain in ['switch', 'input_boolean'] }}"
            sequence:
              - action: "{{ domain }}.turn_{{ 'on' if v | lower in ['on', 'true'] else 'off' }}"
                target:
                  entity_id: "{{ entity }}"
          - alias: Selects (option)
            conditions:
              - condition: template
                value_template: "{{ domain in ['select', 'input_select'] }}"
            sequence:
              - if:
                  - condition: template
                    value_template: "{{ v in (state_attr(entity, 'options') or []) }}"
                then:
                  - action: "{{ domain }}.select_option"
                    target:
                      entity_id: "{{ entity }}"
                    data:
                      option: "{{ v }}"
                else:
                  - action: persistent_notification.create
                    data:
                      title: Timed scene
                      message: "Unknown option '{{ v }}' for {{ entity }}."
        default:
          - action: persistent_notification.create
            data:
              title: Timed scene
              message: "Unsupported entity type: {{ entity }}"


# ---------------------------------------------------------------------
# 3. THE ENGINE
#    Compares the registry with the current time and starts / stops scenes.
#    Two passes: starts first, then stops. When a scene ends exactly when
#    another one starts on the same entities, the new one takes over
#    without any bounce (e.g. a schedule switched back on for a second).
# ---------------------------------------------------------------------
automation:
  - id: timed_scene_engine
    alias: Timed scene – engine
    description: Starts and stops timed scenes according to the sensor.timed_scenes registry.
    mode: queued
    max: 10
    triggers:
      - trigger: time_pattern
        minutes: "/1"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: timed_scene_check
    actions:
      # ----- Pass 1: starts and re-applies -----
      - repeat:
          for_each: "{{ (state_attr('sensor.timed_scenes', 'scenes') or {}).keys() | list }}"
          sequence:
            - variables:
                sid: "{{ repeat.item }}"
                sc: "{{ (state_attr('sensor.timed_scenes', 'scenes') or {}).get(sid) }}"
                ts_now: "{{ now().timestamp() }}"
                in_window: >-
                  {{ sc is not none and as_timestamp(sc.start, 0) <= ts_now < as_timestamp(sc.end, 0) }}
            - if:
                - condition: template
                  value_template: >-
                    {{ in_window and (sc.status == 'planned' or sc.get('reapply', false)) }}
              then:
                - action: script.timed_scene_start
                  data:
                    id: "{{ sid }}"
      # ----- Pass 2: stops and expired scenes -----
      - repeat:
          for_each: "{{ (state_attr('sensor.timed_scenes', 'scenes') or {}).keys() | list }}"
          sequence:
            - variables:
                sid: "{{ repeat.item }}"
                sc: "{{ (state_attr('sensor.timed_scenes', 'scenes') or {}).get(sid) }}"
                ts_now: "{{ now().timestamp() }}"
                ts_start: "{{ as_timestamp(sc.start, 0) if sc is not none else 0 }}"
                ts_end: "{{ as_timestamp(sc.end, 0) if sc is not none else 0 }}"
            - choose:
                - alias: End reached
                  conditions:
                    - condition: template
                      value_template: "{{ sc is not none and sc.status == 'ongoing' and ts_now >= ts_end }}"
                  sequence:
                    - action: script.timed_scene_stop
                      data:
                        id: "{{ sid }}"
                        remove: true
                - alias: Running scene moved to the future
                  conditions:
                    - condition: template
                      value_template: "{{ sc is not none and sc.status == 'ongoing' and ts_now < ts_start }}"
                  sequence:
                    - action: script.timed_scene_stop
                      data:
                        id: "{{ sid }}"
                        remove: false
                - alias: Scene expired without running
                  conditions:
                    - condition: template
                      value_template: "{{ sc is not none and sc.status == 'planned' and ts_now >= ts_end }}"
                  sequence:
                    - event: timed_scene_delete
                      event_data:
                        id: "{{ sid }}"
                    - action: persistent_notification.create
                      data:
                        title: Timed scene
                        message: >-
                          Scene '{{ sid }}' ({{ sc.start }} → {{ sc.end }}) expired
                          without being applied (Home Assistant was probably stopped).
