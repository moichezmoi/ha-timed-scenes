<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Stopwatch button -->
  <rect x="120" y="30" width="16" height="30" fill="#41BDF5"/>
  <rect x="104" y="12" width="48" height="20" rx="6" fill="#41BDF5"/>
  <!-- Clock face -->
  <circle cx="128" cy="140" r="80" fill="#FFFFFF"/>
  <!-- Timed slot (from 0 to the end of the period) -->
  <path d="M128,140 L128,60 A80,80 0 0 1 197.3,180 Z" fill="#FFB74D"/>
  <!-- Ring that is also the return arrow -->
  <path d="M176,56.9 A96,96 0 1 1 66.3,66.5" fill="none" stroke="#41BDF5" stroke-width="20" stroke-linecap="round"/>
  <polygon points="88.2,49.8 50.2,47.4 82.4,85.6" fill="#41BDF5" stroke="#41BDF5" stroke-width="4" stroke-linejoin="round"/>
  <!-- Single stopwatch hand -->
  <line x1="128" y1="140" x2="187.9" y2="123.9" stroke="#1F3A5F" stroke-width="11" stroke-linecap="round"/>
  <circle cx="128" cy="140" r="10" fill="#1F3A5F"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
