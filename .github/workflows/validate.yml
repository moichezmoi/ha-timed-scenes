# Checks that the repository can be installed from the Marketplace (HACS validation)
# and that the integration follows Home Assistant's rules (hassfest).
name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # every Monday: catches changes in Home Assistant's rules
  workflow_dispatch:

jobs:
  marketplace:
    name: Marketplace (HACS) validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
